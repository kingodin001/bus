<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#8fceef"><title>Автобусная суета</title><link rel="stylesheet" href="style.css"></head>
<body><div id="stage"><canvas id="world" aria-label="Игровое поле"></canvas>
<section id="home" class="screen"><div class="home-art"></div><div class="home-shine"></div><div class="brand">АВТОБУСНАЯ<span>СУЕТА</span></div><div class="home-actions left"><button data-action="starter" class="menu-icon" data-icon="coins"><span>Новичок</span></button><button data-action="premium" class="menu-icon" data-icon="crown"><span>Премиум</span></button><button data-action="shop" class="menu-icon" data-icon="shop"><span>Магазин</span></button></div><div class="home-actions right"><button data-action="supplies" class="menu-icon" data-icon="bus"><span>Запас</span></button><button data-action="spin" class="menu-icon" data-icon="wheel"><span>Вращать</span></button><button data-action="daily" class="menu-icon" data-icon="calendar"><span>Отметиться</span></button></div><button class="level-plate" data-action="levels">УРОВЕНЬ <b id="home-level">1</b><small>Выбрать уровень ›</small></button><button class="play button-green" data-action="play">Играть<span>▶</span></button><div class="home-bottom"><span>3 уровня • без интернета</span></div></section>
<div id="topbar"><button class="wallet" data-action="shop"><i data-icon="coin"></i><b id="balance">550</b><em>+</em></button><button class="square settings" data-action="settings" aria-label="Настройки">⚙</button></div>
<section id="game-ui" class="screen hidden"><div class="game-top"><button class="square" data-action="restart" aria-label="Начать заново">↶</button><div class="level-heading">Уровень <b id="level-number">1</b><small id="level-subtitle">Посадите пассажиров по цветам</small></div><button class="square" data-action="pause" aria-label="Пауза">Ⅱ</button></div><div id="slot-labels"></div><div id="passenger-progress"><span></span></div><div id="tutorial"></div><div class="boosters"><button data-action="vip" class="booster" data-icon="vip"><span>VIP</span><b id="vip-count">1</b></button><button data-action="sort" class="booster" data-icon="bus"><span>Упорядочить</span><b id="sort-count">1</b></button><button data-action="shuffle" class="booster" data-icon="wheel"><span>Перемешать</span><b id="shuffle-count">1</b></button></div><button class="hint" data-action="hint">Подсказка</button></section>
<div id="toast" role="status"></div><div id="modal-layer" class="hidden"><div id="modal" role="dialog" aria-modal="true"></div></div><div id="loading" class="hidden"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><span class="plane">✈</span><b>Следующая остановка…</b></div><div id="confetti"></div>
</div><script src="vendor/three.min.js"></script><script src="core.js"></script><script src="icons.js"></script><script src="graphics.js"></script><script src="game.js"></script></body></html>
