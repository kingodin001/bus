name: Build BusSpark 0.2.0 test APK
on:
  push:
    branches:
      - busspark-v0.2.0-rebuild
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify puzzle rules
        run: |
          node tests/rules.cjs
          node --check app/src/main/assets/core.js
          node --check app/src/main/assets/graphics.js
          node --check app/src/main/assets/game.js
      - name: Generate disposable CI-only key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-only.jks" -alias bus -keyalg RSA -keysize 2048 -validity 2 -storepass temporary-ci-signing -keypass temporary-ci-signing -dname "CN=CI, O=BusSpark" -noprompt
      - name: Package test APK (not upgrade-compatible)
        env:
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-35/android.jar
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          BUS_KEYSTORE: ${{ runner.temp }}/ci-only.jks
          BUS_KEY_PASSWORD: temporary-ci-signing
        run: python3 scripts/build-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: BusSpark-0.2.0-TEST-ONLY
          path: dist/BusSpark-0.2.0.apk
          if-no-files-found: error
